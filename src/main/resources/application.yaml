spring:
  application:
    name: ppm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ppm}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:michael}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                headers: false
    consumer:
      group-id: ppm-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    streams:
      application-id: ppm-kpi-aggregator
      properties:
        default:
          key:
            serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        spring:
          json:
            trusted:
              packages: "*"
        commit:
          interval:
            ms: 1000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} trace=%X{traceId:-} span=%X{spanId:-} msg=%msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      issuer: ppm-backend
      secret: ${JWT_SECRET:c5c968b33751b4d5b672f33056508106}
      access-token-minutes: 30
      refresh-token-days: 14
  ingestion:
    rate-limit-per-minute: 60
  kafka:
    topics:
      task-events: ppm.task.events
      kpi-readings: ppm.kpi.readings
      kpi-aggregates: ppm.kpi.aggregates
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ppm-reports}
    presigned-url-minutes: 60
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
