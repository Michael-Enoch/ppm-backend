spring:
  datasource:
    url: jdbc:h2:mem:ppm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

app:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-test
      access-token-minutes: 30
      refresh-token-days: 14